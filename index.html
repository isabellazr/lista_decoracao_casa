<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Decoração - Adicionar Item</title>
    <style>
        /* Estilos básicos para organizar os elementos na tela */
        body { font-family: Arial, sans-serif; padding: 20px; }
        .input-group { margin-bottom: 20px; }
        #linkInput { width: 100%; max-width: 400px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #218838; }
        
        /* Estilo do "card" do produto que vai aparecer */
        .card-produto { 
            border: 1px solid #ddd; 
            padding: 15px; 
            border-radius: 8px; 
            max-width: 350px; 
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }
        .card-produto img { max-width: 100%; border-radius: 4px; margin-bottom: 10px; }
        .card-produto h3 { margin: 0 0 10px 0; font-size: 1.2em; color: #333; }
        .card-produto p { color: #666; font-size: 0.9em; line-height: 1.4; }
    </style>
</head>
<body>

    <h2>Adicionar Item de Decoração</h2>
    
    <div class="input-group">
        <!-- Campo onde você cola o link -->
        <input type="url" id="linkInput" placeholder="Cole o link do produto aqui (ex: https://...)">
        <button onclick="buscarDadosDoLink()">Puxar Informações</button>
    </div>

    <!-- Mensagem de status enquanto carrega -->
    <p id="statusMensagem" style="display: none; color: #007bff;">Carregando informações do site...</p>

    <!-- Div vazia onde o JavaScript vai injetar o produto -->
    <div id="areaDoProduto"></div>

    <script>
        // Função assíncrona que é chamada quando o botão é clicado
        async function buscarDadosDoLink() {
            // 1. Capturar os elementos da tela
            const url = document.getElementById('linkInput').value;
            const areaDoProduto = document.getElementById('areaDoProduto');
            const statusMensagem = document.getElementById('statusMensagem');

            // 2. Validação simples: verificar se o usuário digitou algo
            if (!url) {
                alert("Por favor, cole um link antes de buscar.");
                return;
            }

            // 3. Preparar a tela para a busca
            statusMensagem.style.display = 'block'; // Mostra o texto "Carregando..."
            areaDoProduto.innerHTML = '';           // Limpa buscas anteriores

            try {
                // 4. Comunicação com a API do Microlink
                // O encodeURIComponent garante que barras e caracteres especiais no link não quebrem a URL
