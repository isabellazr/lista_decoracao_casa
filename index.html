<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Decoração - Adicionar Item</title>
    <style>
        /* Estilos básicos para organizar os elementos na tela */
        body { font-family: Arial, sans-serif; padding: 20px; }
        .input-group { margin-bottom: 20px; }
        #linkInput { width: 100%; max-width: 400px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 10px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #218838; }
        
        /* Estilo do "card" do produto */
        .card-produto { 
            border: 1px solid #ddd; 
            padding: 15px; 
            border-radius: 8px; 
            max-width: 350px; 
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }
        .card-produto img { max-width: 100%; border-radius: 4px; margin-bottom: 10px; }
        .card-produto h3 { margin: 0 0 10px 0; font-size: 1.2em; color: #333; }
        .card-produto p { color: #666; font-size: 0.9em; line-height: 1.4; }
        
        /* Estilo para mensagens de erro */
        .erro { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Adicionar Item de Decoração</h2>
    
    <div class="input-group">
        <input type="url" id="linkInput" placeholder="Cole o link completo aqui (ex: https://...)">
        <button onclick="buscarDadosDoLink()">Puxar Informações</button>
    </div>

    <p id="statusMensagem" style="display: none; color: #007bff;">Carregando informações do site...</p>

    <div id="areaDoProduto"></div>

    <script>
        // Função responsável por buscar os dados
        async function buscarDadosDoLink() {
            const url = document.getElementById('linkInput').value;
            const areaDoProduto = document.getElementById('areaDoProduto');
            const statusMensagem = document.getElementById('statusMensagem');

            // Validação: Garante que o usuário digitou algo
            if (!url) {
                alert("Por favor, cole um link antes de clicar em buscar.");
                return;
            }

            // Limpa mensagens anteriores e mostra que está carregando
            statusMensagem.style.display = 'block';
            areaDoProduto.innerHTML = '';           

            try {
                // Faz a requisição para a API
                const resposta = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
                const dados = await resposta.json();

                // >>> NOSSO ESPIÃO DE CÓDIGO (Console.log) <<<
                // Isso vai imprimir no console do navegador tudo o que a API nos devolveu
                console.log("DADOS RECEBIDOS DA API:", dados);

                statusMensagem.style.display = 'none';

                // Verifica se a API conseguiu ler o site corretamente
                if (dados.status === 'success' && dados.data) {
                    const info = dados.data;
                    
                    // Monta o visual na tela com os dados recebidos
                    areaDoProduto.innerHTML = `
                        <div class="card-produto">
                            ${info.image ? `<img src="${info.image.url}" alt="Imagem do produto">` : '<p><em>Sem imagem disponível neste site</em></p>'}
                            <h3>${info.title || 'Título não identificado'}</h3>
                            <p>${info.description || 'Descrição não disponível no site.'}</p>
                            <a href="${info.url}" target="_blank">Acessar no site original</a>
                        </div>
                    `;
                } else {
                    // Mensagem caso o site tenha bloqueado a leitura
                    areaDoProduto.innerHTML = '<p class="erro">O site original bloqueou a leitura das informações (anti-robô) ou o link é inválido. Veja o Console (F12) para detalhes.</p>';
                }

            } catch (erro) {
                statusMensagem.style.display = 'none';
                areaDoProduto.innerHTML = '<p class="erro">Erro de conexão. Verifique o Console (F12).</p>';
                // O console.error ajuda a identificar falhas graves de JavaScript
                console.error("Detalhes do erro fatal:", erro);
            }
        }
    </script>
</body>
</html>
